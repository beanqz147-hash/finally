<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Meetings | MeetSync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <div class="brand">Meet<span>Sync</span></div>
        <p class="sidebar-label">MAIN MENU</p>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="schedule.html">Schedule Meeting</a>
            <a href="meetings.html" class="active">My Meetings</a>
            <a href="join.html">Join Meeting</a>
            <a href="notifications.html">Notifications</a>
            <a href="reports.html">Reports</a>
            <a href="register.html" id="adminNav">Register User</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="index.html" id="logoutLink">Logout</a>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h2>My Meetings</h2>
            <div class="user-info">
                <span id="userName">User</span>
                <span id="userAvatar" class="user-avatar"></span>
            </div>
        </header>

        <section class="dashboard-content">

            <div class="page-heading">
                <div>
                    <h2>Manage Meetings</h2>
                    <p>View, search and manage your scheduled meetings.</p>
                </div>

                <a href="schedule.html" class="btn btn-primary">
                    Schedule Meeting
                </a>
            </div>

            <div class="filter-bar">
                <input
                    type="search"
                    id="meetingSearch"
                    placeholder="Search meetings..."
                >

                <select id="meetingFilter">
                    <option value="all">All Meetings</option>
                    <option value="upcoming">Upcoming</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <div id="meetingsList" class="meetings-list"></div>

        </section>

    </main>

</div>

<script src="app.js"></script>
<script src="meetings.js"></script>

</body>
</html>
