<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | MeetSync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <div class="brand">Meet<span>Sync</span></div>
        <p class="sidebar-label">MAIN MENU</p>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="schedule.html">Schedule Meeting</a>
            <a href="meetings.html">My Meetings</a>
            <a href="join.html">Join Meeting</a>
            <a href="notifications.html" class="active">Notifications</a>
            <a href="reports.html">Reports</a>
            <a href="register.html" id="adminNav">Register User</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="index.html" id="logoutLink">Logout</a>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h2>Notifications</h2>
            <div class="user-info">
                <span id="userName">User</span>
                <span id="userAvatar" class="user-avatar"></span>
            </div>
        </header>

        <section class="dashboard-content">

            <div class="page-heading">
                <div>
                    <h2>My Notifications</h2>
                    <p>Stay updated on your meeting activities.</p>
                </div>

                <div class="notification-actions">
                    <button id="markAllRead" class="btn btn-primary" type="button">
                        Mark All as Read
                    </button>

                    <button id="clearNotifications" class="btn btn-secondary" type="button">
                        Clear All
                    </button>
                </div>
            </div>

            <div id="notificationsList" class="notifications-list"></div>

        </section>

    </main>

</div>

<script src="app.js"></script>
<script src="notifications.js"></script>

</body>
</html>
