<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | MeetSync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <div class="brand">Meet<span>Sync</span></div>

        <p class="sidebar-label">MAIN MENU</p>

        <nav>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="schedule.html">Schedule Meeting</a>
            <a href="meetings.html">My Meetings</a>
            <a href="join.html">Join Meeting</a>
            <a href="notifications.html">Notifications</a>
            <a href="reports.html">Reports</a>
            <a href="register.html" id="adminNav">Register User</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="index.html" id="logoutLink">Logout</a>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h2>Dashboard</h2>
            <div class="user-info">
                <span id="userName">User</span>
                <span id="userAvatar" class="user-avatar"></span>
            </div>
        </header>

        <section class="dashboard-content">

            <div class="stats-grid">

                <div class="stat-card">
                    <h3>Total Meetings</h3>
                    <p id="totalMeetings">0</p>
                </div>

                <div class="stat-card">
                    <h3>Upcoming Meetings</h3>
                    <p id="upcomingMeetings">0</p>
                </div>

                <div class="stat-card">
                    <h3>Completed Meetings</h3>
                    <p id="completedMeetings">0</p>
                </div>

                <div class="stat-card">
                    <h3>Unread Notifications</h3>
                    <p id="unreadNotifications">0</p>
                </div>

            </div>

            <div class="dashboard-grid">

                <div class="dashboard-card">
                    <h3>Meeting Overview</h3>
                    <canvas id="meetingChart"></canvas>
                </div>

                <div class="dashboard-card">
                    <h3>Recent Meetings</h3>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Meeting</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>

                            <tbody id="recentMeetings"></tbody>
                        </table>
                    </div>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
